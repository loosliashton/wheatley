# ==============================================================================
# Wheatley Homelab Agent - Monitored Checks Configuration
# ==============================================================================
# This file defines all health checks monitored by Wheatley.
#
# Keeping checks in checks.yaml isolates your cluster topology and credentials
# (in config.yaml and secrets.env) from routine check configuration and allows
# Wheatley to safely propose and apply threshold, exclusion, or schedule updates
# (such as excluding dormant Docker containers or scheduling maintenance pauses)
# after interactive confirmation in Telegram.
# ==============================================================================

# Optional global pause schedule (applies to all checks during local HH:MM windows)
# schedule:
#   - start: "02:00"
#     end: "04:00"
#     days: ["sun"]       # Optional: mon..sun, "weekdays", or "weekends" (omit for daily)
#     reason: "Weekly Proxmox Backup Server window"

checks:
  # Cluster & Node Health
  - id: node-health
    type: node_metrics
    enabled: true
    interval_seconds: 60
    params:
      nodes: "*"
      cpu_crit_percent: 90
      mem_crit_percent: 90
      duration_minutes: 5

  # Storage Pools
  - id: storage-health
    type: storage
    enabled: true
    interval_seconds: 120
    params:
      nodes: "*"
      warn_percent: 85
      crit_percent: 95

  # Guest states (auto-detects all onboot guests)
  - id: guests-up
    type: guest_state
    enabled: true
    interval_seconds: 60
    params:
      select:
        onboot: true
      exclude: []

  # Service Health Checks
  - id: web-app
    type: http
    enabled: true
    interval_seconds: 60
    params:
      url: "http://{guest:pve-node-01/102}:8080/health"

  - id: media-server
    type: http
    enabled: true
    interval_seconds: 60
    # Optional per-check pause schedule (local HH:MM, supports overnight e.g. 23:00-05:00)
    # schedule:
    #   - start: "03:00"
    #     end: "03:30"
    #     reason: "Nightly library maintenance"
    params:
      url: "http://{guest:pve-node-01/103}:32400/identity"

  # Docker Container Monitoring
  - id: docker-containers
    type: docker
    enabled: true
    interval_seconds: 60
    params:
      guest: "pve-node-01/100"
      containers: "*"
      exclude: []        # Add container names to ignore here
      ignore_exited_0: true  # Silences cleanly stopped/dormant containers
      alert_on:
        - exited
        - unhealthy
        - restarting
