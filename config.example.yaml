# ==============================================================================
# Wheatley Homelab Agent - Example Configuration
# ==============================================================================
# Copy this file to /etc/wheatley/config.yaml and customize for your homelab.
# Secrets (tokens, API keys) must be referenced as ${VAR_NAME} and defined in
# /etc/wheatley/secrets.env (mode 0600).
# ==============================================================================

# Proxmox Nodes (add one entry per PVE host or cluster node)
nodes:
  - name: pve-node-01
    api_url: "https://192.168.1.10:8006"
    ssh:
      host: "192.168.1.10"
      port: 22
      user: "wheatley"
      key_path: "/var/lib/wheatley/.ssh/id_ed25519"
    tls_fingerprint: "${NODE1_TLS_FINGERPRINT}"
    tokens:
      monitor: "${NODE1_TOKEN_MONITOR}"

  - name: pve-node-02
    api_url: "https://192.168.1.11:8006"
    ssh:
      host: "192.168.1.11"
      port: 22
      user: "wheatley"
      key_path: "/var/lib/wheatley/.ssh/id_ed25519"
    tls_fingerprint: "${NODE2_TLS_FINGERPRINT}"
    tokens:
      monitor: "${NODE2_TOKEN_MONITOR}"

# Protect Wheatley from modifying its own container (node/vmid)
self_guest: "pve-node-01/110"

# LLM Provider Configuration (Bring Your Own LLM)
# Wheatley is LLM-agnostic and supports:
#   - Google Gemini: provider: "gemini", model: "gemini-3.8-flash"
#   - Local Ollama:   provider: "ollama", model: "llama3.2", api_base: "http://localhost:11434/v1"
#   - OpenAI:         provider: "openai", model: "gpt-4o-mini", api_key: "${OPENAI_API_KEY}"
#   - Groq:           provider: "groq", model: "llama-3.3-70b-versatile", api_key: "${GROQ_API_KEY}"
#   - Any OpenAI-compatible endpoint (vLLM, LocalAI, DeepSeek, OpenWebUI)
llm:
  provider: "gemini"               # Options: gemini, ollama, openai, groq, openai_compatible
  model: "gemini-3.8-flash"        # Model name
  api_key: "${GEMINI_API_KEY}"     # Or set via env var (e.g. GEMINI_API_KEY or OPENAI_API_KEY)
  # api_base: "http://localhost:11434/v1" # Base URL (defaults to localhost:11434/v1 for ollama)
  temperature: 0.2
  max_tool_iterations: 10
  history_turns: 10
  session_timeout_minutes: 60      # Auto-reset conversation context after 60 mins of inactivity (0 to disable)

# Chat Interfaces
chat:
  telegram:
    bot_token: "${TELEGRAM_BOT_TOKEN}"
    allowed_user_ids:
      - ${TELEGRAM_USER_ID}

# Proxmox Notification Webhook Receiver (receives backup failure alerts etc.)
webhook:
  enabled: true
  host: "0.0.0.0"
  port: 8088
  secret_token: "${WEBHOOK_SECRET_TOKEN:-}"

# Self-monitoring for an external watchdog of your choice (Uptime Kuma, healthchecks.io,
# Gatus, Uptime Robot, ...). Wheatley can't report its own outage, so something
# outside it needs to notice when it goes quiet. Use either mode, or both:
#
#   Pull: point an HTTP monitor at  http://<wheatley-ip>:<webhook.port>/health
#         200 = healthy, 503 = degraded (scheduler stalled or Telegram polling stopped).
#         No auth required; the response contains no hostnames, IPs or check names.
#
#   Push: set push_url to your watchdog's heartbeat URL (e.g. an Uptime Kuma "Push"
#         monitor or a healthchecks.io check). Wheatley requests it every
#         push_interval_seconds while healthy, and stops when degraded or down.
health:
  enabled: true                      # serve GET /health (on the webhook host/port)
  # stale_after_seconds: 300         # default: 3x shortest check interval, min 180s
  push_url: "${HEALTH_PUSH_URL:-}"   # keep in secrets.env; it usually contains a token
  push_interval_seconds: 60
  push_method: GET                   # GET, or POST (sends the health report as JSON)

# ------------------------------------------------------------------------------
# Monitored Checks File (Mandatory Separation)
# ------------------------------------------------------------------------------
# Health checks MUST be configured in a separate file (e.g. /etc/wheatley/checks.yaml).
# Inline 'checks:' inside config.yaml is not allowed.
#
# Keeping checks in checks.yaml isolates your cluster topology and secrets from
# routine check maintenance, and allows Wheatley to safely propose and apply
# threshold or exclusion updates (such as ignoring dormant Docker containers)
# after interactive confirmation in Telegram without modifying config.yaml.
#
# See checks.example.yaml for the complete schema and check definitions.
checks_file: "/etc/wheatley/checks.yaml"

# Commands permitted to run immediately without interactive approval
allowlist:
  - "uptime"
  - "free -m"
  - "df -h"
  - "top -b -n 1"
  - "journalctl -n *"
  - "systemctl status *"
  - "docker ps"
  - "docker logs *"
  - "zpool status*"
  - "smartctl -H *"
  - "sensors -j"
