[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "wheatley"
version = "0.1.0"
description = "Self-hosted AI-driven Proxmox homelab monitoring and administration agent"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Wheatley Project" }]
dependencies = [
    "google-genai>=0.1.0",
    "python-telegram-bot[job-queue]>=21.0",
    "proxmoxer>=2.0.1",
    "requests>=2.31.0",
    "aiohttp>=3.9.0",
    "asyncssh>=2.14.0",
    "apscheduler>=3.10.4",
    "pydantic>=2.6.0",
    "pyyaml>=6.0.1",
    "httpx>=0.25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
]

[project.scripts]
wheatley = "wheatley.cli:main"

[project.entry-points."wheatley.checks"]
# Pluggable check entry points registered in future phases

[tool.setuptools.packages.find]
where = ["."]
include = ["wheatley*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]

